# ============================================================================
# Keep the Supabase projects awake
# ============================================================================
# Supabase pauses free-plan projects after ~7 days of low activity, and a
# paused project does NOT wake on its own. This is not hypothetical: on
# 27 Sep 2026 BOTH projects were found paused. delta-registrations had been
# down for roughly twelve days, so every attempt to register for a tournament
# failed silently — visitors saw an error, and nothing alerted anyone.
#
# Each job pings a tiny Edge Function that runs one trivial query
# (public.keep_warm — returns now(), reads no tables and no personal data).
# Supabase's docs say "a few user requests to the database each day" is enough,
# so this runs three times daily rather than once: scheduled GitHub runs can be
# delayed or skipped under load, and a missed run risks another silent outage.
#
# Deliberately NOT pg_cron: that runs inside the database, while Supabase's
# pausing docs describe external API calls as the remedy. An internal job that
# doesn't count as user activity would look installed and silently fail — the
# exact failure mode this exists to prevent.
#
# NOTE: GitHub disables scheduled workflows on repositories with no activity
# for 60 days. If this repo goes quiet that long, re-enable it from the Actions
# tab, or the pause risk returns.
# ============================================================================

name: Keep Supabase warm

on:
  schedule:
    - cron: '0 */8 * * *'   # 00:00, 08:00, 16:00 UTC
  workflow_dispatch:         # and runnable by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      # One project failing must not stop the other from being pinged.
      fail-fast: false
      matrix:
        include:
          - name: delta-registrations
            ref: omijppvwphqbuozqxliq
            key: sb_publishable_j960XCS2me-UI3swy3kU2A_m__YzUOt
          - name: delta-tournament
            ref: ejcokxagxtyjymdiepjr
            key: sb_publishable_3wgfikfOLRNiGMUiQj5HvQ_ZlK4I8Vt

    name: Ping ${{ matrix.name }}
    steps:
      - name: Ping keep-warm endpoint
        run: |
          # These are publishable keys. They are public by design — the
          # registrations one already appears in register.html's source — so
          # they are not secrets and need no repo secret. The service_role key
          # is never used here.
          URL="https://${{ matrix.ref }}.supabase.co/functions/v1/keep-warm"

          echo "Pinging ${{ matrix.name }}"
          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST "$URL" \
            -H "apikey: ${{ matrix.key }}" \
            -H "Authorization: Bearer ${{ matrix.key }}" \
            --max-time 30)

          BODY=$(echo "$RESPONSE" | sed '$d')
          CODE=$(echo "$RESPONSE" | tail -n1)

          echo "HTTP $CODE"
          echo "$BODY"

          # Fail loudly. A red run in the Actions tab is the whole point — a
          # keep-warm that fails quietly is worse than none at all.
          if [ "$CODE" != "200" ]; then
            echo "::error::keep-warm failed for ${{ matrix.name }} with HTTP $CODE. The project may be paused — check the Supabase dashboard."
            exit 1
          fi

          echo "${{ matrix.name }} is awake."
