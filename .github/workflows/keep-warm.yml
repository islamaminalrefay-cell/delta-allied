# ============================================================================
# Keep the Supabase registration project awake
# ============================================================================
# Supabase pauses free-plan projects after ~7 days of low activity, and a
# paused project does NOT wake on its own. That happened once already and took
# tournament registration down silently for twelve days: visitors saw an error,
# and nothing alerted us.
#
# This pings a tiny Edge Function that runs one trivial query (public.keep_warm,
# which reads no tables and no personal data). Supabase's docs say "a few user
# requests to the database each day" is enough, so this runs three times daily
# rather than once — scheduled GitHub runs can be delayed or skipped under load,
# and the cost of a missed run is another silent outage.
#
# Deliberately NOT pg_cron: that runs inside the database, and Supabase's
# pausing docs describe external API calls as the remedy. An internal job that
# doesn't count would look installed and silently fail.
#
# NOTE: GitHub disables scheduled workflows on repositories with no activity
# for 60 days. If this repo goes quiet that long, re-enable it from the Actions
# tab — or the pause risk returns.
# ============================================================================

name: Keep Supabase warm

on:
  schedule:
    - cron: '0 */8 * * *'   # 00:00, 08:00, 16:00 UTC
  workflow_dispatch:         # and runnable by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-warm endpoint
        run: |
          # This is the publishable key. It is public by design and already
          # visible in register.html's source, so it is not a secret and needs
          # no repo secret. The service_role key is never used here.
          KEY='sb_publishable_j960XCS2me-UI3swy3kU2A_m__YzUOt'
          URL='https://omijppvwphqbuozqxliq.supabase.co/functions/v1/keep-warm'

          echo "Pinging $URL"
          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST "$URL" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            --max-time 30)

          BODY=$(echo "$RESPONSE" | sed '$d')
          CODE=$(echo "$RESPONSE" | tail -n1)

          echo "HTTP $CODE"
          echo "$BODY"

          # Fail loudly. A red run in the Actions tab is the whole point — a
          # keep-warm that fails quietly is worse than none at all.
          if [ "$CODE" != "200" ]; then
            echo "::error::keep-warm failed with HTTP $CODE. The project may be paused — check the Supabase dashboard."
            exit 1
          fi

          echo "Project is awake."
